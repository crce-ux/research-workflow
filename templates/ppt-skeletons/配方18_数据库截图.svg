<!-- 配方 18｜数据库截图 + 红框 + 大数字。把「我确实查过」升级为一手证据。
     画布 1600×900 ｜ 边距 61 ｜ 标题栏高 72（页高 8%）
     字号(px)：大标语 147 ｜ 封面 122 ｜ 标题 60 ｜ 小标题 40 ｜ 正文 32 ｜ 图注·页脚 23
     ⚠️ 字重只有 2 档（常规/粗）——PPTX 端 font-weight 折成布尔，见 ppt_style.WEIGHT
     换主色：改 ppt_style.py 的 C['main']，然后重生成
     交付前：grep "【说明】" 应清零
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Microsoft YaHei','Source Han Sans SC','Noto Sans CJK SC'">
  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
  <defs>
    <linearGradient id="gBand" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#0046A4" stop-opacity="0"/>
      <stop offset="1" stop-color="#0046A4" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="gWash" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0" stop-color="#0046A4" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0046A4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1600" height="72" fill="#0046A4"/>
  <rect x="61" y="20" width="4" height="32" fill="#FFFFFF"/>
  <text x="81" y="48" font-size="40" fill="#FFFFFF" font-weight="700">01</text>
  <text x="139" y="48" font-size="40" fill="#FFFFFF" font-weight="700">交叉空白的规模与唯一的交集证据</text>
  <line x1="61" y1="836" x2="1539" y2="836" stroke="#E4E9EF" stroke-width="1.2"/>
  <text x="61" y="866" font-size="23" fill="#9AA5B4">（项目名）· 汇报</text>
  <text x="1539" y="866" font-size="23" fill="#9AA5B4" text-anchor="end">00</text>
  <rect x="61" y="110" width="900" height="620" fill="none" stroke="#7A8698" stroke-width="1.6" stroke-dasharray="8,5"/>
  <text x="75" y="145.0" font-size="23" fill="#7A8698">【说明】PubMed / ClinicalTrials.gov 检索界面【真实截图】</text>
  <rect x="121" y="210" width="460" height="90" fill="none" stroke="#C00000" stroke-width="3.4"/>
  <text x="993" y="290" font-size="100" fill="#C00000" font-weight="700">0</text>
  <text x="993" y="344" font-size="32" fill="#333333">TITLE 级命中</text>
  <text x="993" y="470" font-size="100" fill="#C00000" font-weight="700">1</text>
  <text x="993" y="524" font-size="32" fill="#333333">TIAB 级命中</text>
  <line x1="981" y1="250" x2="621" y2="250" stroke="#C00000" stroke-width="2.4"/>
  <line x1="641" y1="250" x2="936.0" y2="250.0" stroke="#0046A4" stroke-width="3" stroke-linecap="round"/>
  <polygon points="928.2,259.8 928.2,240.2 949,250" fill="#0046A4"/>
  <rect x="993" y="580" width="546" height="150" fill="none" stroke="#7A8698" stroke-width="1.6" stroke-dasharray="8,5"/>
  <text x="1007" y="615.0" font-size="23" fill="#7A8698">【说明】口径提醒：写明检索式与检索日期</text>
