  <text x="60" y="48" font-size="40" fill="#FFFFFF" font-weight="700">01</text>
  <text x="118" y="48" font-size="40" fill="#FFFFFF" font-weight="700">屏状核：位置、体积与连接</text>
  <rect x="40" y="100" width="740" height="300" fill="#FFFFFF" stroke="#123E6B" stroke-width="1.4"/>
  <text x="64" y="152.0" font-size="40" fill="#123E6B" font-weight="700">要点框（A6 虚线框亦可）</text>
  <text x="64" y="203.2" font-size="32" fill="#333333">· 要点一</text>
  <text x="64" y="248.0" font-size="32" fill="#333333">· 要点二</text>
  <text x="64" y="292.8" font-size="32" fill="#333333">· 要点三</text>
  <line x1="800" y1="250" x2="835.0" y2="250.0" stroke="#123E6B" stroke-width="3" stroke-linecap="round"/>
  <polygon points="827.2,259.8 827.2,240.2 848,250" fill="#123E6B"/>
  <rect x="860" y="100" width="700" height="300" fill="none" stroke="#7A8698" stroke-width="1.6" stroke-dasharray="8,5"/>
  <text x="874" y="135.0" font-size="23" fill="#7A8698">【说明】图：无边框无圆角，紧贴左框</text>
  <rect x="40" y="440" width="1520" height="360" fill="none" stroke="#7A8698" stroke-width="1.6" stroke-dasharray="8,5"/>
  <text x="54" y="475.0" font-size="23" fill="#7A8698">【说明】下段：第二条「框 →箭头→ 图」，或换用其他配方</text>
