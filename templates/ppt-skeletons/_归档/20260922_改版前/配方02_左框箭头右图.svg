<!-- 配方 2｜左框 →箭头→ 右图。箭头端点咬在框边；图紧贴它支持的那一条。
     画布 1600×900 ｜ 边距 40 ｜ 标题栏高 72（页高 8%）
     字号(px)：标题 60 ｜ 小标题 40 ｜ 正文 32 ｜ 图注·页脚 23 ｜ 大数字 50
     换主色：改 ppt_style.py 的 C['main']，然后重生成
     交付前：grep "【说明】" 应清零
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Microsoft YaHei','Source Han Sans SC','Noto Sans CJK SC',sans-serif">
