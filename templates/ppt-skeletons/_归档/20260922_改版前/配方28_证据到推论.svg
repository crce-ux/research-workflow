<!-- 配方 28｜色带 →大箭头→ 色带。左=证据，箭头=「所以」，右=推论。措辞必须分级。
     画布 1600×900 ｜ 边距 40 ｜ 标题栏高 72（页高 8%）
     字号(px)：标题 60 ｜ 小标题 40 ｜ 正文 32 ｜ 图注·页脚 23 ｜ 大数字 50
     换主色：改 ppt_style.py 的 C['main']，然后重生成
     交付前：grep "【说明】" 应清零
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Microsoft YaHei','Source Han Sans SC','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1600" height="72" fill="#123E6B"/>
  <rect x="40" y="20" width="4" height="32" fill="#FFFFFF"/>
  <text x="60" y="48" font-size="40" fill="#FFFFFF" font-weight="700">01</text>
  <text x="118" y="48" font-size="40" fill="#FFFFFF" font-weight="700">从证据到推论</text>
  <rect x="40" y="120" width="1400" height="140" fill="#123E6B"/>
  <text x="64" y="215.2" font-size="32" fill="#FFFFFF" font-weight="700" text-anchor="start">证据：数据结论（措辞不得超出数据支持范围）</text>
  <line x1="800" y1="275" x2="800.0" y2="411.0" stroke="#123E6B" stroke-width="3" stroke-linecap="round"/>
  <polygon points="790.2,403.2 809.8,403.2 800,424" fill="#123E6B"/>
  <text x="824" y="350" font-size="32" fill="#7A8698">所以</text>
  <rect x="120" y="440" width="1360" height="140" fill="#C00000"/>
  <text x="144" y="535.2" font-size="32" fill="#FFFFFF" font-weight="700" text-anchor="start">推论：因此……（须与证据分级，不可写成事实）</text>
  <rect x="40" y="620" width="1520" height="180" fill="none" stroke="#7A8698" stroke-width="1.6" stroke-dasharray="8,5"/>
  <text x="54" y="655.0" font-size="23" fill="#7A8698">【说明】证伪条件 / 待验证事项</text>
  <line x1="40" y1="836" x2="1560" y2="836" stroke="#E4E9EF" stroke-width="1.2"/>
  <text x="40" y="866" font-size="23" fill="#9AA5B4">屏状核 × 氯氮平 · 组会汇报</text>
  <text x="1560" y="866" font-size="23" fill="#9AA5B4" text-anchor="end">00</text>
</svg>
