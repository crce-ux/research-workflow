<!-- 配方 12｜左右双栏对照。两栏结构完全对称，只换内容——差异自己跳出来。
     画布 1600×900 ｜ 边距 61 ｜ 标题栏高 72（页高 8%）
     字号(px)：大标语 147 ｜ 封面 122 ｜ 标题 60 ｜ 小标题 40 ｜ 正文 32 ｜ 图注·页脚 23
     ⚠️ 字重只有 2 档（常规/粗）——PPTX 端 font-weight 折成布尔，见 ppt_style.WEIGHT
     换主色：改 ppt_style.py 的 C['main']，然后重生成
     交付前：grep "【说明】" 应清零
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Microsoft YaHei','Source Han Sans SC','Noto Sans CJK SC'">
